{{ define "main" }}
<div class="container">
    <article class="single-post">
        <header class="post-header">
            <h1>{{ .Title }}</h1>
            <div class="post-meta">
                <time>{{ .Date.Format "Jan 2, 2006" }}</time>
                {{ with .Params.categories }}
                <span class="category">{{ index . 0 }}</span>
                {{ end }}
                <span class="reading-time">{{ .ReadingTime }} min read</span>
            </div>
            {{ if .Params.cover.image }}
            <div class="post-cover">
                <img src="{{ .Params.cover.image }}" alt="{{ .Params.cover.alt }}" loading="lazy">
            </div>
            {{ end }}
        </header>
        <div class="post-body">
            {{ .Content }}
        </div>
        <footer class="post-footer">
            <div class="post-tags">
                {{ range .Params.tags }}
                <a href="/tags/{{ . | urlize }}" class="tag">{{ . }}</a>
                {{ end }}
            </div>
            <div class="share-buttons">
                <span>Share:</span>
                <a href="https://twitter.com/intent/tweet?text={{ .Title }}&url={{ .Permalink }}" target="_blank"><i class="fab fa-twitter"></i></a>
                <a href="https://www.facebook.com/sharer/sharer.php?u={{ .Permalink }}" target="_blank"><i class="fab fa-facebook"></i></a>
                <a href="https://www.linkedin.com/shareArticle?mini=true&url={{ .Permalink }}&title={{ .Title }}" target="_blank"><i class="fab fa-linkedin"></i></a>
            </div>
        </footer>
    </article>
</div>
{{ end }}
