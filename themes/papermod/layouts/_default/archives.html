{{ define "main" }}
<div class="container">
    <h1>{{ .Title }}</h1>
    {{ range .Site.RegularPages.GroupByDate "2006" }}
    <div class="archive-year">
        <h2>{{ .Key }}</h2>
        {{ range .Pages }}
        <div class="archive-item">
            <time>{{ .Date.Format "Jan 2" }}</time>
            <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        </div>
        {{ end }}
    </div>
    {{ end }}
</div>
{{ end }}
